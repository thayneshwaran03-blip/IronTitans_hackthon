<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Automatic Text Summarizer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <div class="container">
        <div class="top-bar">
            <h1>📄 Automatic Text Summarizer</h1>
            <a href="/history" class="history-link">View History →</a>
        </div>
        <p class="subtitle">Paste a long article, circular, or study material below and get a quick, accurate summary.
        </p>

        <div class="input-row">
            <label for="fileInput" class="file-btn">Upload .txt / .pdf</label>
            <input type="file" id="fileInput" accept=".txt,.pdf" hidden>
            <span id="fileName"></span>
        </div>

        <textarea id="inputText" placeholder="Paste your long text here..." rows="12"></textarea>

        <div class="controls">
            <div class="mode-toggle">
                <label><input type="radio" name="mode" value="short" checked> Short</label>
                <label><input type="radio" name="mode" value="detailed"> Detailed</label>
            </div>

            <div class="algo-select">
                <label for="algorithm">Engine:</label>
                <select id="algorithm">
                    <option value="auto">Auto (best available)</option>
                    <option value="transformer">Transformer (AI)</option>
                    <option value="textrank">Extractive - TextRank</option>
                    <option value="lsa">Extractive - LSA</option>
                    <option value="luhn">Extractive - Luhn</option>
                </select>
            </div>

            <button id="summarizeBtn">Summarize</button>
        </div>

        <div class="slider-row">
            <label for="lengthSlider">Summary length: <span id="lengthLabel">Medium</span></label>
            <input type="range" id="lengthSlider" min="10" max="40" value="20">
        </div>

        <div id="status"></div>

        <div id="outputBox" class="output-box" style="display:none;">
            <div class="output-header">
                <h2>Summary</h2>
                <button id="copyBtn">Copy</button>
            </div>
            <p id="summaryText"></p>
            <div class="stats" id="stats"></div>
            <div class="engine-tag" id="engineTag"></div>

            <details class="keywords-details">
                <summary>Show key terms & highlighted original</summary>
                <div class="keywords-list" id="keywordsList"></div>
                <p id="highlightedOriginal" class="highlighted-text"></p>
            </details>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>

</html>
